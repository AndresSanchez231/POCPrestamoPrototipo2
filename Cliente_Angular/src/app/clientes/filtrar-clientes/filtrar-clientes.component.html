<div style="padding: 20px;">
  <h2>Filtrar Clientes por Préstamo</h2>
  <input type="number" [(ngModel)]="idPrestamo" placeholder="ID Préstamo">
  <button (click)="filtrar()">Filtrar</button>
  <div *ngIf="error" style="color:red;">{{ error }}</div>

  <table border="1" style="width: 100%; margin-top: 10px;">
    <thead>
      <tr style="background-color: #3f51b5; color: white;">
        <th>ID</th><th>Nombre</th><th>Cédula</th><th>Ingresos</th><th>Fecha Nac</th><th>Estado</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of clientes">
        <td>{{c.idCliente}}</td>
        <td>{{c.nombreCompleto}}</td>
        <td>{{c.cedula}}</td>
        <td>{{c.ingresosMensuales | number:'1.2-2'}}</td>
        <td>{{c.fechaNacimiento}}</td>
        <td>{{c.estado ? 'ACTIVO' : 'INACTIVO'}}</td>
      </tr>
    </tbody>
  </table>
</div>
