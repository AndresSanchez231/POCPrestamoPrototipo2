<div style="padding: 20px; max-width: 500px;">
  <h2>Actualizar Cliente (Búsqueda Previa)</h2>
  
  <div style="margin-bottom: 20px;">
    <input type="number" [(ngModel)]="id" placeholder="ID Cliente" style="padding: 5px;">
    <button (click)="buscar()" style="padding: 5px 15px; margin-left: 10px;">Buscar</button>
  </div>

  <div *ngIf="error" style="color: red; margin-bottom: 10px; font-weight: bold;">
    {{ error }}
  </div>
  <div *ngIf="mensaje" style="color: green; margin-bottom: 10px; font-weight: bold;">
    {{ mensaje }}
  </div>
  
  <div *ngIf="cliente" style="display: grid; gap: 15px;">
    <div>
      <label><strong>ID Cliente:</strong> {{ cliente.idCliente }}</label>
    </div>
    
    <div>
      <label>Nombre:</label>
      <input type="text" [(ngModel)]="cliente.nombreCompleto" style="width: 100%; padding: 5px;">
    </div>

    <div>
      <label>Cédula:</label>
      <input type="text" [(ngModel)]="cliente.cedula" style="width: 100%; padding: 5px;">
    </div>

    <div>
      <label>Ingresos:</label>
      <input type="number" step="0.01" [(ngModel)]="cliente.ingresosMensuales" style="width: 100%; padding: 5px;">
    </div>

    <div>
      <label>Fecha Nacimiento:</label>
      <input type="datetime-local" [(ngModel)]="cliente.fechaNacimiento" style="width: 100%; padding: 5px;">
    </div>

    <div>
      <label>Préstamo Asociado:</label>
      <!-- COMBOBOX: Selecciona el préstamo por su ID manual, pero guarda el ObjectId -->
      <select [(ngModel)]="idPrestamoSeleccionado" style="width: 100%; padding: 5px;">
        <option value="" disabled selected>Seleccione un préstamo</option>
        <option *ngFor="let p of prestamosDisponibles" [value]="p._id">
          Préstamo #{{p.idPrestamo}} - {{p.tipo}} - Monto: {{p.monto}}
        </option>
      </select>
    </div>

    <div>
      <button (click)="actualizar()" style="background-color: #ff9800; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">
        Actualizar Cliente
      </button>
    </div>
  </div>
</div>
