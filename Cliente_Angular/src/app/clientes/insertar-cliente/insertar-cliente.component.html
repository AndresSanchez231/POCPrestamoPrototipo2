<div style="padding: 20px; max-width: 500px; margin: auto;">
  <h2>Insertar Cliente</h2>
  
  <div *ngIf="error" style="color: red; margin-bottom: 10px; font-weight: bold;">
    {{ error }}
  </div>
  <div *ngIf="mensaje" style="color: green; margin-bottom: 10px; font-weight: bold;">
    {{ mensaje }}
  </div>

  <div style="display: grid; gap: 15px;">
    <div>
      <label>ID Cliente:</label>
      <input type="number" [(ngModel)]="idCliente" style="width: 100%; padding: 5px;">
    </div>

    <div>
      <label>Nombre Completo:</label>
      <input type="text" [(ngModel)]="nombreCompleto" style="width: 100%; padding: 5px;">
    </div>

    <div>
      <label>Cédula:</label>
      <input type="text" [(ngModel)]="cedula" style="width: 100%; padding: 5px;">
    </div>

    <div>
      <label>Ingresos Mensuales:</label>
      <input type="text" [(ngModel)]="ingresosMensuales" style="width: 100%; padding: 5px;">
    </div>

    <div>
      <label>Fecha Nacimiento:</label>
      <input type="datetime-local" [(ngModel)]="fechaNacimiento" style="width: 100%; padding: 5px;">
    </div>

    <div>
      <label>Préstamo Asociado:</label>
      <!-- COMBOBOX: Selecciona el préstamo por su ID manual, pero guarda el _id (ObjectId) -->
      <select [(ngModel)]="idPrestamo" style="width: 100%; padding: 5px;">
        <option value="" disabled selected>Seleccione un préstamo</option>
        <option *ngFor="let p of prestamosDisponibles" [value]="p._id">
          Préstamo #{{p.idPrestamo}} - {{p.tipo}} - Monto: {{p.monto}}
        </option>
      </select>
    </div>

    <div>
      <button (click)="guardar()" style="padding: 10px 20px; background-color: #3f51b5; color: white; border: none; border-radius: 5px; cursor: pointer;">
        Guardar Cliente
      </button>
    </div>
  </div>
</div>
