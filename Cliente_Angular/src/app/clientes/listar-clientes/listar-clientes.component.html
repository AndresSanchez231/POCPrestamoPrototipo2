<div style="padding: 20px;">
  <h2>Listar Todos los Clientes</h2>

  <table border="1" style="width: 100%; text-align: left; border-collapse: collapse;">
    <thead>
      <tr style="background-color: #3f51b5; color: white;">
        <th style="padding: 10px;">ID</th>
        <th style="padding: 10px;">Nombre</th>
        <th style="padding: 10px;">Cédula</th>
        <th style="padding: 10px;">Ingresos</th>
        <th style="padding: 10px;">Fecha Nac</th>
        <th style="padding: 10px;">ID Préstamo</th>
        <th style="padding: 10px;">Estado</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of clientes">
        <td style="padding: 8px;">{{c.idCliente}}</td>
        <td style="padding: 8px;">{{c.nombreCompleto}}</td>
        <td style="padding: 8px;">{{c.cedula}}</td>
        <td style="padding: 8px;">{{c.ingresosMensuales | number:'1.2-2'}}</td>
        <td style="padding: 8px;">{{c.fechaNacimiento}}</td>
        <!-- Aquí se mostrará el ID manual (1, 2, etc.) gracias al .ts -->
        <td style="padding: 8px;">{{c.idPrestamo}}</td> 
        <td style="padding: 8px;">{{c.estado ? 'ACTIVO' : 'INACTIVO'}}</td>
      </tr>
    </tbody>
  </table>
</div>
