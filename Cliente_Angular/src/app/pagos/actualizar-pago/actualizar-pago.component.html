<div style="padding: 20px; max-width: 500px;">
  <h2>Actualizar Pago (Búsqueda Previa)</h2>
  
  <div style="margin-bottom: 20px;">
    <input type="number" [(ngModel)]="id" placeholder="ID Pago" style="padding: 5px;">
    <button (click)="buscar()" style="padding: 5px 15px; margin-left: 10px;">Buscar</button>
  </div>

  <div *ngIf="error" style="color: red; margin-bottom: 10px; font-weight: bold;">{{ error }}</div>
  <div *ngIf="mensaje" style="color: green; margin-bottom: 10px; font-weight: bold;">{{ mensaje }}</div>
  
  <div *ngIf="pago" style="display: grid; gap: 15px;">
    <div>
      <label><strong>ID Pago:</strong> {{ pago.idPago }}</label>
    </div>
    
    <div>
      <label>Monto:</label>
      <input type="number" step="0.01" [(ngModel)]="pago.monto" style="width: 100%; padding: 5px;">
    </div>

    <div>
      <label>Método:</label>
      <select [(ngModel)]="pago.metodoPago" style="width: 100%; padding: 5px;">
        <option value="" disabled>Seleccione un método</option>
        <option value="Efectivo">Efectivo</option>
        <option value="Tarjeta">Tarjeta</option>
        <option value="Transferencia">Transferencia</option>
      </select>
    </div>

    <div>
      <label>Fecha:</label>
      <input type="datetime-local" [(ngModel)]="pago.fechaPago" style="width: 100%; padding: 5px;">
    </div>

    <div>
      <label>ID Préstamo:</label>
      <input type="number" [(ngModel)]="pago.idPrestamo" style="width: 100%; padding: 5px;">
    </div>

    <div>
      <button (click)="actualizar()" style="background-color: #ff9800; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">
        Actualizar Pago
      </button>
    </div>
  </div>

  <div style="margin-top: 30px; text-align: center;">
    <button (click)="volverAlMenu()" style="padding: 10px 20px; background-color: #607d8b; color: white; border: none; border-radius: 5px; cursor: pointer;">
      Volver al Menú Principal
    </button>
  </div>
</div>
